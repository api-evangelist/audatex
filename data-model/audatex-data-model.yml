  exists; id formats are read from the specs (uuid for AudaConnect assessments/images/subscriptions, int32 for TLA
  quotes and terminals, uuid for API Gateway image captures/webhooks/jobs).
summary: 406 entities with properties and 405 relationships. AudaConnect centres on the Assessment (uuid or composite
  originator+number id) which owns Images, Calculations, Mails, Logs and Exports and belongs to a Company/Site/Terminal
  and a Workprovider; Vehicles are resolved by VRN or VIN; PartsOrders hold Parts from Suppliers; Subscriptions
  bind a Topic to a user/site/company and yield NotificationMessages. The API Gateway centres on the ImageCapture
  request (uuid) which yields ImageAttachments, VI calculations, AI Triage results and Reports, and on Webhooks
  subscribed to WebhookEventTypes.
id_formats:
- entity: Assessment
  format: uuid, or composite originator + assessment number (Assessment_AssessmentIDviaOriginatorAndNumber resolves
    the composite to the uuid)
- entity: Image
  format: uuid (imageId) or sequence number within an assessment
- entity: Subscription / Notification
  format: uuid
- entity: TLA Quote
  format: int32 quoteId
- entity: Terminal / Site
  format: int32
- entity: ImageCapture / Webhook / Job (API Gateway)
  format: uuid
- entity: Vehicle
  format: VRN (UK registration, 3+ characters) or VIN
