    name: Audatex AudaConnect API
    description: |
      The AudaConnect WebAPI (Audatex UK) enables third-party software developers to access, query and update the Audatex platform: assessments (search, create shell, import/export AxFormat, PDF reports, calculations, images, mails), vehicle lookup by VRN/VIN and CAP valuation, parts prices and orders, suppliers, users, sites and work providers, total-loss-avoidance quotes, and topic-based notification subscriptions (poll or push). Swagger 2.0, 93 operations, OAuth 2.0 with 18 scopes.
