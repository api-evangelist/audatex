  name: Solera API Gateway (North America)
  description: >
    The Solera Integrations Public API portal for North America lists the Audatex/Solera claims services
    available to integrators, including the ClaimImage document-return API, with Swagger documentation
    for each service. The portal root redirects unauthenticated visitors to a Solera | Audatex login,
    so the service catalog and per-service Swagger documents are customer-gated; the ClaimImage Return
    API guide is served as a public PDF.
