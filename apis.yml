      The Solera Dashboard Assignment API (Audatex North America) is the FNOL assignment integration surface behind the Solera claims dashboard. The publicly served OpenAPI 3.0.1 document describes only the versioned /api/Version probe; assignment operations require the b2b.fnol.api scope from the dispatch-login identity server and are documented to onboarded partners. Only the demo/test instance is publicly documented.
