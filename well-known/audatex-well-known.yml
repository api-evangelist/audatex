generated: '2026-09-17'
method: probed
source: live probes of /.well-known/ on every Audatex / Solera host the record knows (2026-09-17)
summary: >-
  One real document is served: an OpenID Connect discovery document (RFC 8414 shaped, IdentityServer
  style) on dispatch-login-demo.audatex.com — the authorization server that the GIC and Dashboard
  Assignment OpenAPIs name as their tokenUrl. That is a genuine WellKnown hit and the pointer is
  earned. Nothing else is served anywhere: no security.txt on any host (so NO SecurityTxt pointer),
  no api-catalog, no ai-plugin.json, no oauth-protected-resource, and no A2A agent card on either
  the canonical or the legacy path.
pointer_basis: >-
  WellKnown + OpenIDConnect pointers emitted on the strength of the 200 on
  dispatch-login-demo.audatex.com/.well-known/openid-configuration (application/json, 2,493 bytes,
  issuer https://dispatch-login-demo.audatex.com, 34 scopes_supported). SecurityTxt NOT emitted —
  RFC 9116 is unimplemented on every host probed.
false_positive_watch: >-
  solera.com (apex) answers 301 to www.solera.com for every path; www.solera.com answers a 160 KB
  WordPress 404 page for every /.well-known/* path. audatex.com answers a 97-byte meta-refresh to
  solera.com at / and a plain 404 elsewhere. None of these are documents.
