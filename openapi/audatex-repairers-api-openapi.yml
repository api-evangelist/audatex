          - 'null'
          description: City / Postal Town
        line5:
          type:
          - string
          - 'null'
          description: County / Province / State
        line6:
          type:
          - string
          - 'null'
          description: Postal Code / ZIP
        country:
          type:
          - string
          - 'null'
        latitude:
          type:
          - number
          - 'null'
          format: double
        longitude:
          type:
          - number
          - 'null'
          format: double
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: apiKey
      description: "JWT Authorization header using the Bearer scheme. \n\n Enter 'Bearer' [space] and then your token in the text input below.\n\nExample: \"Bearer 12345abcdef\""
      name: Authorization
