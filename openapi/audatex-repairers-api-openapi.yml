    RepairerRespVM:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type:
          - string
          - 'null'
        countryCode:
          type:
          - string
          - 'null'
        address:
          $ref: '#/components/schemas/AddressResponseVM'
        aliases:
          type:
          - array
          - 'null'
          items:
