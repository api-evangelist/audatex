openapi: 3.2.0
info:
  title: Audatex.APIGateway Repairers API
  termsOfService: https://www.solera.com/legal/
  contact:
    name: Solera Development Team
    url: https://docs.microsoft.com/en-us/aspnet/core/tutorials/getting-started-with-swashbuckle?view=aspnetcore-2.2&tabs=visual-studio
    email: development@solera.com
  license:
    name: License
    url: https://www.solera.com/legal/
  version: V1
servers:
- url: /APIGateway
security:
- Bearer: []
- Bearer: []
tags:
- name: Repairers
paths:
  /api/v1/Repairers/search:
    get:
      tags:
      - Repairers
      summary: Search repairers by name
      description: This endpoint performs a wildcard search on Repairer name and aliases.
      parameters:
      - name: country
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Country'
      - name: name
        in: query
        required: true
        schema:
          minLength: 2
          type: string
      - name: pageSize
        in: query
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Returns list of entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RepairerRespVM'
        '400':
          description: Returns an error if the request fails validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Sorry, an unexpected error has occurred
        '401':
          description: Returns an error if the user is not authorised
      operationId: getApiV1RepairersSearch
      x-operation-id-source: derived
components:
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    Country:
      enum:
      - UK
      - ZA
      - US
      - CA
      - FR
      - IE
      - RO
      - PL
      - CH
      - AD
