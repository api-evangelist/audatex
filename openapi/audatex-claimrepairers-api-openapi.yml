components:
  schemas:
    RAMCustomField:
      type: object
      properties:
        fieldId:
          type: string
          format: uuid
        name:
          type:
          - string
          - 'null'
        value:
          type:
          - string
          - 'null'
      additionalProperties: false
    VehicleViewModel:
      required:
      - make
      - model
      - monthRegistered
      - registration
      - year
      type: object
      properties:
        registration:
          minLength: 1
          type: string
        make:
          minLength: 1
          type: string
        model:
          minLength: 1
          type: string
        monthRegistered:
          maximum: 12
          minimum: 1
          type: integer
          format: int32
        year:
          maximum: 9999
          minimum: 1901
          type: integer
          format: int32
      additionalProperties: false
    ClaimRepairersReqViewModel:
      required:
      - claim
      - insured
      - numberOfResultsPerScheme
      - vehicle
      - vehicleLocation
      type: object
      properties:
        claim:
          $ref: '#/components/schemas/ClaimRepairersClaimViewModel'
        vehicle:
          $ref: '#/components/schemas/VehicleViewModel'
        vehicleLocation:
          $ref: '#/components/schemas/LocationViewModel'
        insured:
          $ref: '#/components/schemas/InsuredViewModel'
        numberOfResultsPerScheme:
          maximum: 4294967295
          minimum: 1
          type: integer
          format: int32
      additionalProperties: false
    RamGenericData:
      type: object
      properties:
        text:
          type:
          - string
          - 'null'
        value:
          type:
          - string
          - 'null'
      additionalProperties: false
    ClaimRepairersClaimViewModel:
      required:
      - claimNumber
      - clientKey
      - incidentDateTimeUTC
      - policyNumber
      type: object
      properties:
        clientKey:
          type: string
          format: uuid
        claimNumber:
          minLength: 1
          type: string
        policyNumber:
          minLength: 1
          type: string
        incidentDateTimeUTC:
          type: string
          format: date-time
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    LocationViewModel:
      required:
      - latitude
      - longitude
      type: object
      properties:
        latitude:
          maximum: 90
          minimum: -90
          type: number
          format: double
        longitude:
          maximum: 180
          minimum: -180
          type: number
          format: double
      additionalProperties: false
    InsuredViewModel:
      required:
      - name
      type: object
      properties:
        name:
          type: string
      additionalProperties: false
    ClaimRepairerRespViewModel:
      type: object
      properties:
        rank:
          type: integer
          format: int32
        repairerName:
          type:
          - string
          - 'null'
        repairerId:
          type: string
          format: uuid
        clientRepairerId:
          type: integer
          format: int32
        terminalId:
          type:
          - string
          - 'null'
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        customFields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/RAMCustomField'
        distance:
          $ref: '#/components/schemas/RamGenericData'
        duration:
          $ref: '#/components/schemas/RamGenericData'
        ncrPerformance:
          type:
          - number
          - 'null'
          format: double
        priority:
          type: boolean
        isWarranty:
          type: boolean
      additionalProperties: false
  securitySchemes:
