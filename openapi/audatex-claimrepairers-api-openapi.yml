          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/ClaimRepairersReqViewModel'
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRepairersReqViewModel'
          text/json:
            schema:
              $ref: '#/components/schemas/ClaimRepairersReqViewModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ClaimRepairersReqViewModel'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClaimRepairerRespViewModel'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClaimRepairerRespViewModel'
            text/json:
              schema:
                type: array
                items:
