openapi: 3.2.0
info:
  title: Audatex.APIGateway Vi Damaged Parts API
  termsOfService: https://www.solera.com/legal/
  contact:
    name: Solera Development Team
    url: https://docs.microsoft.com/en-us/aspnet/core/tutorials/getting-started-with-swashbuckle?view=aspnetcore-2.2&tabs=visual-studio
    email: development@solera.com
  license:
    name: License
    url: https://www.solera.com/legal/
  version: V1
servers:
- url: /APIGateway
security:
- Bearer: []
- Bearer: []
tags:
- name: ViDamagedParts
paths:
  /api/v1/ViDamagedParts:
    post:
      tags:
      - ViDamagedParts
      summary: POST Vi DamagedParts request
      description: This endpoint will allow you to request a VI DamagedParts
      requestBody:
        description: ''
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/ViDamagedPartsReqVM'
          application/json:
            schema:
              $ref: '#/components/schemas/ViDamagedPartsReqVM'
          text/json:
            schema:
              $ref: '#/components/schemas/ViDamagedPartsReqVM'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ViDamagedPartsReqVM'
      responses:
        '202':
          description: Returns an accepted response. The CalculationId returned, can be used in subsequent GET requests for ViDamagedParts.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/CalculationSelfViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationSelfViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/CalculationSelfViewModel'
        '400':
          description: Returns an error if the request fails validation or if the imageCapture cannot be found or if the imageCapture status is not yet complete
          content:
            text/plain:
              schema:
                type: object
                additionalProperties:
                  type: string
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
            text/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        '500':
          description: Sorry, an unexpected error has occurred
        '401':
          description: Returns an error if the user is not authorised
      operationId: postApiV1ViDamagedParts
      x-operation-id-source: derived
  /api/v1/ViDamagedParts/{imageCaptureId}/{calculationId}:
    get:
      tags:
      - ViDamagedParts
      summary: GET a VI DamagedParts request
      description: This endpoint will allow you to get the details of a VI DamagedParts
      parameters:
      - name: imageCaptureId
        in: path
        description: ''
        required: true
        schema:
          type: string
          format: uuid
      - name: calculationId
        in: path
        description: ''
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Returns a response with the details of a ViDamagedParts
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ViDamagedPartsRespVM'
            application/json:
              schema:
                $ref: '#/components/schemas/ViDamagedPartsRespVM'
            text/json:
              schema:
                $ref: '#/components/schemas/ViDamagedPartsRespVM'
        '400':
          description: Returns an error if the request fails validation
          content:
            text/plain:
              schema:
                type: object
                additionalProperties:
                  type: string
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
            text/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        '500':
          description: Sorry, an unexpected error has occurred
        '401':
          description: Returns an error if the user is not authorised
      operationId: getApiV1ViDamagedPartsByImageCaptureIdByCalculationId
      x-operation-id-source: derived
