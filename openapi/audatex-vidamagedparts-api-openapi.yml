    ViErrorViewModel:
      type: object
      properties:
        code:
          type:
          - string
          - 'null'
        message:
          type:
          - string
          - 'null'
        properties:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ViErrorPropertyViewModel'
      additionalProperties: false
    ViErrorPropertyViewModel:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        value:
          type:
          - string
          - 'null'
      additionalProperties: false
    ViDamagedPartsPartsRespVM:
      type: object
      properties:
        standardGuideNumber:
          type:
          - integer
          - 'null'
          format: int32
        genericPartName:
          type:
          - string
          - 'null'
        objectDetectionLabels:
          type:
          - array
          - 'null'
          items:
            type: string
        p:
          type:
          - number
          - 'null'
          format: double
        positions:
          type:
          - array
          - 'null'
          items:
            type: integer
            format: int32
        relatedImageIds:
          type:
          - array
          - 'null'
          items:
            type: string
            format: uuid
        position:
          $ref: '#/components/schemas/ViDamagedPartsPositionRespVM'
      additionalProperties: false
    CalculationSelfViewModel:
      type: object
      properties:
        calculationId:
          type: string
          format: uuid
        self:
          type:
          - string
          - 'null'
        warnings:
          type:
          - array
          - 'null'
          items:
            type: string
      additionalProperties: false
    ViDamagedPartsReqVM:
      required:
      - countryCode
      - imageCaptureId
      type: object
      properties:
        imageCaptureId:
          type: string
          description: The imageCaptureId
          format: uuid
        countryCode:
          $ref: '#/components/schemas/Country'
      additionalProperties: false
    ViDamagedPartsValueRespVM:
      type: object
      properties:
        damagedPartsGroupid:
          type: string
          format: uuid
        p:
          type:
          - number
          - 'null'
          format: double
        damagedPartsGroup:
          type:
          - string
          - 'null'
        side:
          type:
          - string
          - 'null'
        parts:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ViDamagedPartsPartsRespVM'
      additionalProperties: false
    ViDamagedPartsRespVM:
      type: object
      properties:
        status:
          type:
          - string
          - 'null'
        errors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ViErrorViewModel'
        damagedParts:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ViDamagedPartsValueRespVM'
      additionalProperties: false
    ViDamagedPartsPositionRespVM:
      type: object
      properties:
        code:
          type:
          - integer
          - 'null'
          format: int32
        p:
          type:
          - number
          - 'null'
          format: double
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: apiKey
      description: "JWT Authorization header using the Bearer scheme. \n\n Enter 'Bearer' [space] and then your token in the text input below.\n\nExample: \"Bearer 12345abcdef\""
      name: Authorization
      in: header
