    AssetPropertiesReqVM:
      required:
      - axManufacturer
      - axModel
      - axModelOptions
      - axSubModel
      - bodyType
      - make
      - model
      - year
      type: object
      properties:
        make:
          minLength: 1
          type: string
        model:
          minLength: 1
          type: string
        year:
          minLength: 1
          type: string
        bodyType:
          minLength: 1
          type: string
        axManufacturer:
          minLength: 1
          type: string
        axModel:
          minLength: 1
          type: string
        axSubModel:
          minLength: 1
          type: string
        axModelOptions:
          minLength: 1
          type: string
      additionalProperties: false
    ImageType:
      enum:
