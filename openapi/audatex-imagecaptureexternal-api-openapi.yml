          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    ICExternalV2ReqVM:
      required:
      - clientReferenceId
      type: object
      properties:
        clientReferenceId:
          maxLength: 255
          minLength: 1
          type: string
          description: Customer unique reference Id
        asset:
          $ref: '#/components/schemas/ImageCaptureAssetIdentifierReqVM'
        collectionId:
          type:
          - string
          - 'null'
          description: Image CollectionId
          format: uuid
        jobId:
          type:
          - string
          - 'null'
          description: Job for this ImageRequest to be linked with
          format: uuid
        expiryDate:
          maximum: 30
          minimum: 1
          type:
          - integer
          - 'null'
          format: int32
        images:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ICExternalV2ImageInfoReqVM'
          description: List of images information to be initialized
      additionalProperties: false
    ICExternalReqVM:
      required:
      - clientReferenceId
      - images
      type: object
      properties:
        clientReferenceId:
          maxLength: 255
          minLength: 1
          type: string
          description: Customer unique reference Id
        asset:
