          - string
          - 'null'
        tags:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Tag'
        type:
          $ref: '#/components/schemas/ImageType'
      additionalProperties: false
    WarningModel:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
