openapi: 3.2.0
info:
  version: v1
  title: AudaConnect Internal Data API
  description: 'AudaConnect. You can use this Swagger page to test the API. You will need to authenticate either at the top of the page for multiple scopes or clicking on the authentication status image on each operation. You will need to use your supplied Client Application ID during when selecting scopes. AudaConnect API Build Version: 2.25.26048.2'
  contact:
    name: Audatex UK
    url: https://audaconnect.ax-aee.co.uk/AudaAPI.WebAPI/help
    email: servicedesk@audatex.co.uk
servers:
- url: https://audaconnect.ax-aee.co.uk/AudaAPI.WebAPI
tags:
- name: InternalData
paths:
  /api/internal/search:
    get:
      tags:
      - InternalData
      summary: Get a list of internal data relating to a specific vehicle registration.
      operationId: InternalData_Search
      parameters:
      - name: vehicleRegistration
        in: query
        description: A vehicle registration.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AudaAPI.Models.InternalData'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AudaAPI.Models.InternalData'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AudaAPI.Models.InternalData'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AudaAPI.Models.InternalData'
      security:
      - oauth2:
        - Internal.DataServices
    post:
      tags:
      - InternalData
      summary: Get a list of internal data relating to a specific vehicle registration.
      operationId: InternalData_SearchWithParameters
      parameters:
      - name: vehicleRegistration
        in: query
        description: A vehicle registration.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AudaAPI.Models.InternalData'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AudaAPI.Models.InternalData'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AudaAPI.Models.InternalData'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AudaAPI.Models.InternalData'
      security:
      - oauth2:
        - Internal.DataServices
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AudaAPI.Models.SearchParameters'
          text/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AudaAPI.Models.SearchParameters'
          application/xml:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AudaAPI.Models.SearchParameters'
          text/xml:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AudaAPI.Models.SearchParameters'
        description: Array of SearchParameters.
        required: true
  /api/internal/search/restricted:
    post:
      tags:
