  /api/internal/assessment/{id}:
    get:
      tags:
      - InternalData
      summary: Get a specific assessment
      operationId: InternalData_GetAssessment
      parameters:
      - name: id
        in: path
        description: The unique ID of the assessment.
        required: true
        schema:
          type: string
          format: uuid
      - name: companyId
        in: query
        description: The unique ID of the company.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudaAPI.Models.AssessmentView'
            text/json:
              schema:
                $ref: '#/components/schemas/AudaAPI.Models.AssessmentView'
            application/xml:
              schema:
                $ref: '#/components/schemas/AudaAPI.Models.AssessmentView'
            text/xml:
              schema:
                $ref: '#/components/schemas/AudaAPI.Models.AssessmentView'
      security:
      - oauth2:
        - Internal.DataServices
  /api/internal/assessment/{assessmentId}/images/{imageId}:
    get:
      tags:
      - InternalData
      summary: Get a specific image
      operationId: InternalData_GetImage
      parameters:
      - name: assessmentId
        in: path
        description: The unique ID of the assessment.
        required: true
        schema:
          type: string
          format: uuid
      - name: imageId
        in: path
        description: The unique ID of the image.
        required: true
        schema:
          type: string
          format: uuid
      - name: companyId
        in: query
        description: The unique ID of the company
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
      security:
      - oauth2:
        - Internal.DataServices
