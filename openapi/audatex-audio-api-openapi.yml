        '401':
          description: Returns an error if the user is not authorised
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        '500':
          description: Sorry, an unexpected error has occurred
      operationId: postApiV1AudioInfo
      x-operation-id-source: derived
    servers:
    - url: /APIGateway
components:
  schemas:
    FileModel:
      type: object
      properties:
        filename:
          maxLength: 200
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        type:
          $ref: '#/components/schemas/FileType'
        collectionId:
          type:
          - string
          - 'null'
          format: uuid
      additionalProperties: false
    FileType:
      enum:
      - MP4
      - AVI
      - MOV
      - WAV
      type: string
    Stream:
      type: object
      properties:
        canRead:
          type: boolean
          readOnly: true
        canWrite:
          type: boolean
          readOnly: true
        canSeek:
          type: boolean
          readOnly: true
        canTimeout:
          type: boolean
          readOnly: true
        length:
          type: integer
          format: int64
          readOnly: true
        position:
          type: integer
          format: int64
        readTimeout:
          type: integer
          format: int32
        writeTimeout:
          type: integer
          format: int32
      additionalProperties: false
    SelfViewModel:
      type: object
      properties:
        id:
          type: string
          format: uuid
        self:
          type:
          - string
          - 'null'
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: apiKey
      description: "JWT Authorization header using the Bearer scheme. \n\n Enter 'Bearer' [space] and then your token in the text input below.\n\nExample: \"Bearer 12345abcdef\""
      name: Authorization
      in: header
