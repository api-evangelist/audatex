        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AudaAPI.BMSAPI.DTO.Subscription'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AudaAPI.BMSAPI.DTO.Subscription'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AudaAPI.BMSAPI.DTO.Subscription'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AudaAPI.BMSAPI.DTO.Subscription'
        '204':
          description: OK - No subscriptions were found
        '401':
          description: Invalid or missing authentication token
        '403':
          description: Insufficient permissions for this resource
        '500':
          description: The server has failed to process the request
      security:
      - oauth2:
        - BMS.Basic
    post:
      tags:
      - Event
      summary: Subscribe my site to a Topic using the Topic code
      description: Subscribe my site to a Topic using the Topic code. Only SubscriptionID may be populated in the response please ignore the other obsolete values.
      operationId: Event_SiteSubscribe
      parameters:
      - name: topicCode
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudaAPI.BMSAPI.DTO.SubscriptionObsolete'
            text/json:
              schema:
                $ref: '#/components/schemas/AudaAPI.BMSAPI.DTO.SubscriptionObsolete'
            application/xml:
              schema:
                $ref: '#/components/schemas/AudaAPI.BMSAPI.DTO.SubscriptionObsolete'
            text/xml:
              schema:
                $ref: '#/components/schemas/AudaAPI.BMSAPI.DTO.SubscriptionObsolete'
        '400':
          description: Topic format is not valid
        '401':
          description: Invalid or missing authentication token
        '403':
          description: Insufficient permissions for this resource
        '404':
          description: Non existing topic
        '409':
          description: Already subscribed
        '500':
          description: The server has failed to process the request
      security:
      - oauth2:
        - BMS.Basic
  /v1/bmsapi/site/subscriptions/{subscriptionId}:
    delete:
      tags:
      - Event
      summary: Delete a subscription for my site
      description: Delete a subscription for my site.
      operationId: Event_SiteUnsubscribe
      parameters:
      - name: subscriptionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
        '401':
          description: Invalid or missing authentication token
        '403':
          description: Insufficient permissions for this resource
        '404':
          description: Non existing subscription
        '500':
          description: The server has failed to process the request
      security:
      - oauth2:
        - BMS.Basic
  /v1/bmsapi/site/subscriptions/{subscriptionId}/notifications:
    get:
      tags:
      - Event
      summary: Poll this method to get notifications for a subscription, e.g. every 5 minutes
      description: 'Poll this method to get notifications for a subscription, e.g. every 5 minutes. . Note: the ResourceURIs Array is obsolete and may no longer be populated'
      operationId: Event_SiteNotificationsGet
      parameters:
      - name: subscriptionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AudaAPI.BMSAPI.DTO.NotificationMessage'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AudaAPI.BMSAPI.DTO.NotificationMessage'
            application/xml:
              schema:
                type: array
