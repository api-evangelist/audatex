openapi: 3.2.0
info:
  version: v1
  title: Audatex services for BMS Systems Event API
  description: 'Allows a BMS system to get and update assessment related data. You can use this Swagger page to test the API. You will need to authenticate by clicking on the authentication status image on each operation. You will need to grant access to the BMS.Basic scope and supply valid Audatex credentials when prompted. The ''see more at'' link below contains a lot more information on how you can setup authentication for your application. BMS API Build Version: 2.25.26162.1'
  contact:
    name: Audatex UK
    url: https://audaconnect.ax-aee.co.uk/AudaAPI.BMSAPI/home/help
    email: servicedesk@audatex.co.uk
servers:
- url: https://audaconnect.ax-aee.co.uk/AudaAPI.BMSAPI
tags:
- name: Event
paths:
  /v1/bmsapi/topics:
    get:
      tags:
      - Event
      summary: Get all topics Sites or Companies can subscribe to
      description: Get all topics Sites or Companies can subscribe to.
      operationId: Event_GetTopics
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AudaAPI.BMSAPI.DTO.Topic'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AudaAPI.BMSAPI.DTO.Topic'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AudaAPI.BMSAPI.DTO.Topic'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AudaAPI.BMSAPI.DTO.Topic'
        '401':
          description: Invalid or missing authentication token
        '403':
          description: Insufficient permissions for this resource
        '500':
          description: The server has failed to process the request
      security:
      - oauth2:
        - BMS.Basic
  /v1/bmsapi/site/subscriptions:
    get:
      tags:
      - Event
      summary: Get all subscriptions for my site
      description: Get all subscriptions for my site.
      operationId: Event_SiteSubscriptionsGet
