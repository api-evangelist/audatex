components:
  schemas:
    AudaAPI.BMSAPI.DTO.SubscriptionPush:
      type: object
      properties:
        URL:
          type: string
        Format:
          enum:
          - Uninitialised
          - XML
          - JSON
          type: string
        AuthEnabled:
          type: boolean
        AuthScheme:
          type: string
        AuthParameter:
          type: string
    AudaAPI.BMSAPI.DTO.NotificationParameter:
      type: object
      properties:
        Key:
          type: string
        Value:
          type: string
    AudaAPI.BMSAPI.DTO.Subscription:
      type: object
      properties:
        SubscriptionId:
          format: uuid
          type: string
        Topic:
          $ref: '#/components/schemas/AudaAPI.BMSAPI.DTO.Topic'
        CreatedAt:
          format: date-time
          type: string
        Push:
          $ref: '#/components/schemas/AudaAPI.BMSAPI.DTO.SubscriptionPush'
    AudaAPI.BMSAPI.DTO.NotificationResource:
      type: object
      properties:
        ResourceType:
          type: string
        ResourceId:
          format: uuid
          type: string
    AudaAPI.BMSAPI.DTO.NotificationMessage:
      type: object
      properties:
        NotificationId:
          format: uuid
          type: string
        SubscriptionId:
          format: uuid
          type: string
        EventType:
          type: string
        Topic:
          type: string
        Message:
          type: string
        CompanyCode:
          type: string
        SiteId:
          type: string
        CreatedAt:
          format: date-time
          type: string
        Parameters:
          type: array
          items:
            $ref: '#/components/schemas/AudaAPI.BMSAPI.DTO.NotificationParameter'
        Resources:
          type: array
          items:
            $ref: '#/components/schemas/AudaAPI.BMSAPI.DTO.NotificationResource'
    AudaAPI.BMSAPI.DTO.Topic:
      type: object
      properties:
        TopicCode:
          type: string
        Description:
          type: string
    AudaAPI.BMSAPI.DTO.SubscriptionObsolete:
      type: object
      properties:
        SubscriptionId:
          format: uuid
          type: string
        Topic:
          $ref: '#/components/schemas/AudaAPI.BMSAPI.DTO.Topic'
        CreatedAt:
          format: date-time
          type: string
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        implicit:
          scopes:
            BMS.Basic: Basic access to assessment data for your BMS application
            BMS.Extended: Extened access to assessment data for your BMS application
            BMS.Parts: Access to BMS Parts Apis
            BMS.PartsOrders: Access to BMS Parts Orders Apis
          authorizationUrl: https://audaconnect.ax-aee.co.uk/AudaAPI.Portal/Oauth20
      description: OAuth2 Implicit Grant
