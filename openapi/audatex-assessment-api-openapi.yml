openapi: 3.2.0
info:
  title: Audatex Assessment API
  version: '1.0'
  description: 'Operations tagged Assessment across 3 of this provider''s published API definitions: audatex-api-gateway-openapi-original.json, audatex-audaconnect-api-openapi-original.json, audatex-audaconnect-bms-api-openapi-original.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /APIGateway
- url: https://audaconnect.ax-aee.co.uk/AudaAPI.WebAPI
- url: https://audaconnect.ax-aee.co.uk/AudaAPI.BMSAPI
tags:
- name: Assessment
paths:
  /api/v1/Assessment/Post:
    post:
      tags:
      - Assessment
      summary: Create an assessment
      description: This endpoint will allow you to create an assessment
      requestBody:
        description: ''
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/AssessmentReqViewModel'
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentReqViewModel'
          text/json:
            schema:
              $ref: '#/components/schemas/AssessmentReqViewModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AssessmentReqViewModel'
        required: true
      responses:
        '201':
          description: Returns a created response
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SelfWithErrorModel'
            application/json:
              schema:
                $ref: '#/components/schemas/SelfWithErrorModel'
            text/json:
              schema:
                $ref: '#/components/schemas/SelfWithErrorModel'
        '400':
          description: Returns an error if the request fails validation or if the assessment failed to create
          content:
            text/plain:
              schema:
                type: object
                additionalProperties:
                  type: string
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
            text/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        '500':
          description: Sorry, an unexpected error has occurred
        '401':
          description: Returns an error if the user is not authorised
        '409':
          description: Returns a conflict response if a assessment is already created with the given assessment number and originator
      deprecated: true
      security:
      - Bearer: []
      - Bearer: []
      operationId: postApiV1AssessmentPost
      x-operation-id-source: derived
    servers:
    - url: /APIGateway
  /api/assessments:
    get:
      tags:
      - Assessment
      summary: Retrieves a list of assessments for the logged in user, ordered by the most…
      operationId: Assessment_Get
      parameters:
      - name: filterId
        in: query
        description: Optionally filter the results with a specified filter criterium.
        required: false
        schema:
          type: string
          format: uuid
      - name: userParameterValue
        in: query
        description: user filter parameters
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AudaAPI.Models.AssessmentSummary'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AudaAPI.Models.AssessmentSummary'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AudaAPI.Models.AssessmentSummary'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AudaAPI.Models.AssessmentSummary'
      security:
      - oauth2:
        - Assessment.MainIndex
    post:
      tags:
      - Assessment
      summary: Creates a new shell assessment
      operationId: Assessment_Post
      parameters:
      - name: siteId
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '201':
          description: Resource does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Audatex.NextGen.Services.AssessmentServices.Import.AssessmentImportSucceededResult'
            text/json:
              schema:
                $ref: '#/components/schemas/Audatex.NextGen.Services.AssessmentServices.Import.AssessmentImportSucceededResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/Audatex.NextGen.Services.AssessmentServices.Import.AssessmentImportSucceededResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/Audatex.NextGen.Services.AssessmentServices.Import.AssessmentImportSucceededResult'
        '400':
          description: The input data is invalid or not understood
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Audatex.NextGen.Services.AssessmentServices.Import.AssessmentImportFailedResult'
            text/json:
              schema:
                $ref: '#/components/schemas/Audatex.NextGen.Services.AssessmentServices.Import.AssessmentImportFailedResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/Audatex.NextGen.Services.AssessmentServices.Import.AssessmentImportFailedResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/Audatex.NextGen.Services.AssessmentServices.Import.AssessmentImportFailedResult'
        '401':
          description: Invalid or missing authentication token
      security:
      - oauth2:
        - Assessment.EditAssessmentAdminData
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Audatex.NextGen.Services.AssessmentServices.Import.AssessmentImport'
          text/json:
            schema:
              $ref: '#/components/schemas/Audatex.NextGen.Services.AssessmentServices.Import.AssessmentImport'
          application/xml:
            schema:
              $ref: '#/components/schemas/Audatex.NextGen.Services.AssessmentServices.Import.AssessmentImport'
          text/xml:
            schema:
              $ref: '#/components/schemas/Audatex.NextGen.Services.AssessmentServices.Import.AssessmentImport'
        required: true
    servers:
    - url: https://audaconnect.ax-aee.co.uk/AudaAPI.WebAPI
  /api/assessmentsV2:
    get:
      tags:
      - Assessment
      summary: Retrieves a list of assessments for the logged in user, ordered by the most…
      operationId: Assessment_GetV2
      parameters:
      - name: filterId
