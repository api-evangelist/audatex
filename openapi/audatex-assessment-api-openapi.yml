  /api/mails/{mailId}/report:
    get:
      tags:
      - Assessment
      summary: Retrieve an AudaMail as a PDF report
      operationId: Mail_GetReport
      parameters:
      - name: mailId
        in: path
        description: Mail ID for the AudaMail
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: PDF File with AudaMail Report
          content:
            application/json:
              schema:
                format: byte
                type: string
            text/json:
              schema:
                format: byte
                type: string
            application/xml:
              schema:
                format: byte
                type: string
            text/xml:
              schema:
                format: byte
                type: string
        '400':
          description: Specified mail cannot be returned as a report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudaAPI.WebAPI.Models.AudaMail.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AudaAPI.WebAPI.Models.AudaMail.ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/AudaAPI.WebAPI.Models.AudaMail.ErrorResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/AudaAPI.WebAPI.Models.AudaMail.ErrorResponse'
        '404':
          description: No AudaMail found for specified ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudaAPI.WebAPI.Models.AudaMail.ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AudaAPI.WebAPI.Models.AudaMail.ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/AudaAPI.WebAPI.Models.AudaMail.ErrorResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/AudaAPI.WebAPI.Models.AudaMail.ErrorResponse'
      security:
      - oauth2:
        - Assessment.MailReport
    servers:
    - url: https://audaconnect.ax-aee.co.uk/AudaAPI.WebAPI
  /v1/bmsapi/assessments/originator/{originator}/assessments/{assessmentnumber}:
    get:
      tags:
