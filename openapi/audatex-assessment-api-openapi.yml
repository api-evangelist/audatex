      tags:
      - Assessment
      summary: Mark a specified assessment as complete
      operationId: Assessment_CompleteAssessment
      parameters:
      - name: id
        in: path
        description: The unique ID of the assessment.
        required: true
        schema:
          type: string
          format: uuid
      responses:
