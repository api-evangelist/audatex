  /api/assessments/{id}/summary:
    get:
      tags:
      - Assessment
      summary: Get an assessment summary by its unique or composite ID.
      operationId: Assessment_GetSummary
      parameters:
      - name: id
        in: path
        description: Either a guid (the OBID of the assessment) or composite key ({Originator}-{AssessmentNumber}).
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudaAPI.Models.AssessmentSummary'
            text/json:
              schema:
