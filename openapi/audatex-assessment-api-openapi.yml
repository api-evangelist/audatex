    servers:
    - url: https://audaconnect.ax-aee.co.uk/AudaAPI.WebAPI
  /api/assessments/{id}/modeloptions:
    get:
      tags:
      - Assessment
      operationId: Assessment_GetModelOptions
      parameters:
      - name: id
        in: path
        required: true
