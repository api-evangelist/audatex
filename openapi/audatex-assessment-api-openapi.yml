          text/xml:
            schema:
              $ref: '#/components/schemas/AudaAPI.Models.AssessmentSummary'
        description: The updated summary values and a user to whom the assessment should be reassigned.
        required: true
    servers:
    - url: https://audaconnect.ax-aee.co.uk/AudaAPI.WebAPI
  /api/assessments/{id}:
    get:
      tags:
      - Assessment
      summary: 'Get the specified assessment. Note: a lock will not be created on the assessment'
      operationId: Assessment_GetAssessment
      parameters:
      - name: id
        in: path
        description: The unique ID of the assessment.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudaAPI.Models.AssessmentView'
            text/json:
              schema:
                $ref: '#/components/schemas/AudaAPI.Models.AssessmentView'
            application/xml:
