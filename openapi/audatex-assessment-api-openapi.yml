      security:
      - oauth2:
        - Assessment.MainIndex
    post:
      tags:
      - Assessment
      summary: Update the assessment with the posted values.
      operationId: Assessment_PostSummary
      parameters:
      - name: id
        in: path
        description: The unqiue ID of the assessment.
        required: true
