tags:
- name: Repairer
paths:
  /api/v1/Repairer/Get:
    get:
      tags:
      - Repairer
      summary: Get the details of a repairer by repairerId
      description: The details returned about the repairer are controlled via the OAuth2 scopes.
      parameters:
      - name: repairerId
        in: query
        description: The id of the repairer
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Returns the repairer details
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/RepairerResponseVM'
            application/json:
              schema:
                $ref: '#/components/schemas/RepairerResponseVM'
            text/json:
              schema:
                $ref: '#/components/schemas/RepairerResponseVM'
        '400':
          description: Returns an error if the request fails validation
          content:
            text/plain:
              schema:
                type: object
                additionalProperties:
                  type: string
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
            text/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        '500':
          description: Sorry, an unexpected error has occurred
        '401':
          description: Returns an error if the user is not authorised
      deprecated: true
      operationId: getApiV1RepairerGet
      x-operation-id-source: derived
components:
  schemas:
    RepairerResponseVM:
      type: object
      properties:
        id:
