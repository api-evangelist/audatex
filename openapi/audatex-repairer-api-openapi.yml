        emailAddress:
          type:
          - string
          - 'null'
        telephoneNumber:
          type:
          - string
          - 'null'
        aliases:
          type:
          - array
          - 'null'
          items:
            type: string
        rates:
          $ref: '#/components/schemas/RepairerRatesResponseVM'
        schemes:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/RepairerSchemeResponseVM'
        customFields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/RepairerCustomFieldResponseVM'
      additionalProperties: false
    RepairerRatesResponseVM:
