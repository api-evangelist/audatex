          - number
          - 'null'
          format: double
        fixedPricePaintMat:
          type:
          - number
          - 'null'
          format: double
      additionalProperties: false
    RepairerSchemeResponseVM:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type:
          - string
          - 'null'
      additionalProperties: false
    RepairerCustomFieldResponseVM:
      type: object
