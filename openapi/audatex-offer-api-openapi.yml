    ImageCaptureRecipientVM:
      required:
      - dialingCode
      - mobileNumber
      type: object
      properties:
        dialingCode:
          maxLength: 5
          minLength: 1
          type: string
          description: Dialing code for mobile number. Format +XX
        mobileNumber:
          maxLength: 11
          minLength: 8
          type: string
          description: The Mobile number where Image capture SMS will be sent.
        lineType:
          type:
          - string
          - 'null'
          description: The LineType of the mobile number.
      additionalProperties: false
    VehicleOfferViewModel:
      required:
      - make
      - model
      type: object
      properties:
        make:
          minLength: 1
          type: string
          description: Vehicle make (required)
        model:
          minLength: 1
          type: string
          description: Vehicle model (required)
      additionalProperties: false
      description: Vehicle information for Offer
    OfferDetailsModel:
      required:
      - currency
      - offerAmount
      - vehicle
      type: object
      properties:
        currency:
          maxLength: 3
          minLength: 1
          type: string
        offerAmount:
          minLength: 1
          type: string
        repairs:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - string
