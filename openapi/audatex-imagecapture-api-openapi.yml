components:
  schemas:
    ImageCaptureCommunicationResVM:
      type: object
      properties:
        id:
          type: string
          format: uuid
        recipient:
          $ref: '#/components/schemas/ImageCaptureRecipientVM'
        message:
          type:
          - string
          - 'null'
        from:
          type:
          - string
          - 'null'
        type:
          $ref: '#/components/schemas/CommunicationType'
        status:
          $ref: '#/components/schemas/ImageCaptureStatusType'
        deliveryStatus:
          $ref: '#/components/schemas/CommunicationStatus'
        dateSent:
          $ref: '#/components/schemas/ImageCaptureDateViewModel'
        enableLineTypeIntelligence:
          type: boolean
        template:
          type:
          - string
          - 'null'
        variables:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - string
            - 'null'
        reminders:
          $ref: '#/components/schemas/ReminderConfigModel'
      additionalProperties: false
    ImageCaptureUsingTemplateCommunicationVM:
      required:
      - recipient
      type: object
      properties:
        recipient:
          $ref: '#/components/schemas/ImageCaptureRecipientVM'
        from:
          maxLength: 150
          type:
          - string
          - 'null'
          description: The name of the sender
        message:
          maxLength: 300
          type:
          - string
          - 'null'
          description: The message to be sent in SMS. The API will substitute {IC_URL} for the image request link and {IC_PIN} for the image request pin.
        type:
          $ref: '#/components/schemas/CommunicationType'
        shortUrl:
          maxLength: 50
          type:
          - string
          - 'null'
          description: The short Url for the image capture link
        template:
          type:
          - string
          - 'null'
        variables:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - string
            - 'null'
        reminders:
          $ref: '#/components/schemas/ReminderConfigModel'
      additionalProperties: false
    ImageCaptureResCommunicationVM:
      type: object
      properties:
        communicationId:
          type:
          - string
          - 'null'
          format: uuid
        status:
          $ref: '#/components/schemas/ImageCaptureStatusType'
        dateSent:
          type: string
          format: date-time
        dateReceived:
          type: string
          format: date-time
        errorMessage:
          type:
          - string
          - 'null'
      additionalProperties: false
    WarningModel:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
      additionalProperties: false
    AssetPropertiesReqVM:
      required:
      - axManufacturer
      - axModel
      - axModelOptions
      - axSubModel
      - bodyType
      - make
      - model
      - year
      type: object
      properties:
        make:
          minLength: 1
          type: string
        model:
          minLength: 1
          type: string
        year:
          minLength: 1
          type: string
        bodyType:
          minLength: 1
          type: string
        axManufacturer:
          minLength: 1
          type: string
        axModel:
          minLength: 1
          type: string
        axSubModel:
          minLength: 1
          type: string
        axModelOptions:
          minLength: 1
          type: string
      additionalProperties: false
    ImageCaptureUsingTemplateReqViewModel:
      required:
      - templateName
      type: object
      properties:
        linkExpiryDays:
          maximum: 30
          minimum: 1
          type:
          - integer
          - 'null'
          description: Set the time in days that the image request link will expire in.
          format: int32
        language:
          type:
          - string
          - 'null'
          description: Set the language for the image capture UI. Optional; if not provided, defaults to "en-GB".
        timeZone:
          $ref: '#/components/schemas/TimeZone'
        styling:
          $ref: '#/components/schemas/ImageCaptureStylingVM'
        pageConfiguration:
          $ref: '#/components/schemas/ImageCapturePageConfigurationVM'
        clientReferenceId:
          maxLength: 255
          type:
          - string
