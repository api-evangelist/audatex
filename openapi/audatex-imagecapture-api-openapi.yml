  /api/v1/ImageCapture/{imageCaptureId}:
    get:
      tags:
      - ImageCapture
      summary: Gets details about an image capture
      description: This API will allow you to get details of an image capture
      parameters:
      - name: imageCaptureId
        in: path
        description: The id of the image capture
        required: true
        schema:
          type: string
          format: uuid
      - name: scale
        in: query
        description: "Optional parameter. To which size the images of the image capture will escalated when they are returned.\n            Currently, only <em>NoScale</em> and <em>OneMP</em> (Default value) are supported. Other values in the list of available values are for future uses.\n            Use of default value is strongly recommended."
