              $ref: '#/components/schemas/ImageCaptureReqViewModel'
          text/json:
            schema:
              $ref: '#/components/schemas/ImageCaptureReqViewModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ImageCaptureReqViewModel'
      responses:
        '201':
          description: Returns a created response
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ImageCaptureSelfViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/ImageCaptureSelfViewModel'
            text/json:
              schema:
