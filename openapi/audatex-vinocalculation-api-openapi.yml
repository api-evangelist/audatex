      - SG
      - SK
      - SI
      - ES
      - SE
      - TW
      - TR
      - UA
      - AE
      - GB
      - VE
      type: string
    ViNoCalculationV2ReqVM:
      required:
      - countryCode
      - imageCaptureId
      type: object
      properties:
        imageCaptureId:
          type: string
          description: The imageCaptureId
          format: uuid
        includeContours:
          type: boolean
          description: 'Include damage contours in the result data

            This will default to false'
        includeDamagedParts:
          type: boolean
          description: 'Include damaged parts in the result data

            This will default to false'
        countryCode:
          $ref: '#/components/schemas/Country'
      additionalProperties: false
    ViCalculationPartRespVM:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        side:
          type:
          - string
          - 'null'
      additionalProperties: false
    ViErrorViewModel:
      type: object
      properties:
        code:
          type:
          - string
          - 'null'
        message:
          type:
          - string
          - 'null'
        properties:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ViErrorPropertyViewModel'
      additionalProperties: false
    ViErrorPropertyViewModel:
      type: object
      properties:
        name:
          type:
          - string
