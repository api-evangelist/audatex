paths:
  /api/v1/ViNoCalculation:
    post:
      tags:
      - ViNoCalculation
      summary: POST VI Calculation request
      description: This endpoint will allow you to request a VI Calculation
      parameters:
      - name: X-Data-Region
        in: header
        description: Enter the region for the image capture to be stored. Example format 'solera-uk'
        required: true
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/ViNoCalculationReqVM'
          application/json:
            schema:
              $ref: '#/components/schemas/ViNoCalculationReqVM'
          text/json:
            schema:
              $ref: '#/components/schemas/ViNoCalculationReqVM'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ViNoCalculationReqVM'
      responses:
        '202':
          description: Returns an accepted response. The CalculationId returned, can be used in subsequent GET requests for viNoCalculation.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/CalculationSelfViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationSelfViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/CalculationSelfViewModel'
        '500':
          description: Sorry, an unexpected error has occurred
        '400':
          description: Returns an error if the request fails validation or if the imageCapture cannot be found or if the imageCapture status is not yet complete
        '401':
          description: Returns an error if the user is not authorised
      operationId: postApiV1ViNoCalculation
      x-operation-id-source: derived
  /api/v1/ViNoCalculation/{imageCaptureId}/{calculationId}:
    get:
      tags:
      - ViNoCalculation
      summary: GET a VI Calculation request
      description: This endpoint will allow you to get the details of a VI Calculation
      parameters:
      - name: imageCaptureId
        in: path
        description: ''
        required: true
        schema:
          type: string
          format: uuid
      - name: calculationId
        in: path
        description: ''
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Data-Region
        in: header
        description: Enter the region for the image capture to be stored. Example format 'solera-uk'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Returns a response with the details of a VI Calculation
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ViNoCalculationRespVM'
            application/json:
              schema:
                $ref: '#/components/schemas/ViNoCalculationRespVM'
            text/json:
              schema:
                $ref: '#/components/schemas/ViNoCalculationRespVM'
        '500':
          description: Sorry, an unexpected error has occurred
        '400':
          description: Returns an error if the request fails validation
        '401':
          description: Returns an error if the user is not authorised
      operationId: getApiV1ViNoCalculationByImageCaptureIdByCalculationId
      x-operation-id-source: derived
  /api/v1/ViNoCalculation/{imageCaptureId}/{calculationId}/images/{imageId}/{format}:
    get:
      tags:
      - ViNoCalculation
      summary: GET an image of a VI Calculation request, with contours
      description: This endpoint will allow you to get an image of a VI Calculation request, with contours
      parameters:
      - name: imageCaptureId
        in: path
        description: ''
        required: true
        schema:
          type: string
          format: uuid
      - name: calculationId
        in: path
        description: ''
        required: true
        schema:
          type: string
          format: uuid
      - name: imageId
        in: path
        description: ''
        required: true
        schema:
          type: string
          format: uuid
      - name: format
        in: path
        description: ''
        required: true
        schema:
          type: string
          default: binary
      - name: contourThickness
        in: query
        description: ''
        schema:
          type: integer
          format: int32
          default: 3
      - name: X-Data-Region
        in: header
        description: Enter the region for the image capture to be stored. Example format 'solera-uk'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Returns a response with the image of a VI Calculation with contours
        '204':
          description: Returns no content
        '400':
          description: Returns an error if the request fails validation
        '401':
          description: Returns an error if the user is not authorised
        '500':
          description: Sorry, an unexpected error has occurred
      operationId: getApiV1ViNoCalculationByImageCaptureIdByCalculationIdImagesByImageIdByFormat
      x-operation-id-source: derived
  /api/v2/ViNoCalculation:
    post:
      tags:
      - ViNoCalculation
      summary: POST VI Calculation V2 request
      description: This endpoint will allow you to request a VI Calculation V2
      parameters:
      - name: X-Data-Region
        in: header
