          application/json:
            schema:
              $ref: '#/components/schemas/ViNoCalculationV2ReqVM'
          text/json:
            schema:
              $ref: '#/components/schemas/ViNoCalculationV2ReqVM'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ViNoCalculationV2ReqVM'
      responses:
        '202':
          description: Returns an accepted response. The CalculationId returned, can be used in subsequent GET requests for viNoCalculation V2.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/CalculationSelfViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationSelfViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/CalculationSelfViewModel'
        '400':
          description: Returns an error if the request fails validation or if the imageCapture cannot be found or if the imageCapture status is not yet complete
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Returns an error if the user is not authorised
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Sorry, an unexpected error has occurred
      operationId: postApiV2ViNoCalculation
      x-operation-id-source: derived
  /api/v2/ViNoCalculation/{imageCaptureId}/{calculationId}:
    get:
      tags:
      - ViNoCalculation
      summary: GET a VI Calculation V2 request
      description: This endpoint will allow you to get the details of a VI Calculation V2
      parameters:
      - name: imageCaptureId
        in: path
        description: ''
        required: true
        schema:
          type: string
          format: uuid
      - name: calculationId
        in: path
        description: ''
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Data-Region
        in: header
        description: Enter the region for the image capture to be stored. Example format 'solera-uk'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Returns a response with the details of a VI Calculation V2
          content:
            text/plain:
              schema:
