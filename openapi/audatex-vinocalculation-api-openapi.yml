            application/json:
              schema:
                $ref: '#/components/schemas/ViNoCalculationV2RespVM'
            text/json:
              schema:
                $ref: '#/components/schemas/ViNoCalculationV2RespVM'
        '400':
          description: Returns an error if the request fails validation
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Returns an error if the user is not authorised
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Sorry, an unexpected error has occurred
      operationId: getApiV2ViNoCalculationByImageCaptureIdByCalculationId
      x-operation-id-source: derived
components:
  schemas:
    ViCalculationDimensionRespVM:
      type: object
      properties:
        areaInCmSq:
          type:
          - number
          - 'null'
          format: double
        widthInCm:
          type:
          - number
          - 'null'
          format: double
        lengthInCm:
          type:
          - number
          - 'null'
          format: double
        relativeSize:
          type:
          - number
          - 'null'
          format: double
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    ViCalculationDamageRespVM:
      type: object
      properties:
        damageId:
          type: string
          format: uuid
        type:
