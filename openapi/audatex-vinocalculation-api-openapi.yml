          - 'null'
        warnings:
          type:
          - array
          - 'null'
          items:
            type: string
      additionalProperties: false
    ViNoCalculationReqVM:
      required:
      - countryCode
      - imageCaptureId
      type: object
      properties:
        imageCaptureId:
          type: string
          description: The imageCaptureId
          format: uuid
        enhancedVerification:
          type: boolean
          description: 'EnhancedVerification required

            This will default to false'
        includeContours:
          type: boolean
          description: 'Include damage contours in the result data

            This will default to false'
        countryCode:
          $ref: '#/components/schemas/Country'
      additionalProperties: false
    ViCalculationIdWithContoursRespVM:
      type: object
      properties:
        id:
          type: string
          format: uuid
        damageContour:
          type:
          - array
          - 'null'
          items:
            type: array
            items:
              type: number
              format: double
      additionalProperties: false
    ViCalculationV2DamageRespVM:
      type: object
      properties:
        damageId:
          type: string
          format: uuid
        type:
          type:
          - string
          - 'null'
        probability:
          type: number
          format: double
        relativeSize:
          type:
          - number
          - 'null'
          format: double
        part:
          $ref: '#/components/schemas/ViCalculationPartRespVM'
        foundInImages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ViCalculationIdWithContoursRespVM'
      additionalProperties: false
    ViDamagedPartsValueRespVM:
      type: object
      properties:
        damagedPartsGroupid:
          type: string
          format: uuid
        p:
          type:
          - number
          - 'null'
          format: double
        damagedPartsGroup:
          type:
          - string
          - 'null'
        side:
          type:
          - string
          - 'null'
        parts:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ViDamagedPartsPartsRespVM'
      additionalProperties: false
    ViNoCalculationV2RespVM:
      type: object
      properties:
        status:
          type:
          - string
          - 'null'
        errors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ViErrorViewModel'
        damagedParts:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ViDamagedPartsValueRespVM'
        damages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ViCalculationV2DamageRespVM'
      additionalProperties: false
    ViNoCalculationRespVM:
      type: object
      properties:
        status:
          type:
          - string
          - 'null'
        errors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ViErrorViewModel'
        damages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ViCalculationDamageRespVM'
      additionalProperties: false
