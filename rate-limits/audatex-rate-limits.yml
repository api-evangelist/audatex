specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Audatex
providerId: audatex
created: '2026-05-04'
modified: '2026-09-17'
generated: '2026-09-17'
method: searched
source: >-
  https://audaconnect.ax-aee.co.uk/AudaAPI.BMSAPI/home/help, https://audaconnect.ax-aee.co.uk/AudaAPI.WebAPI/help,
  the five specs in openapi/, and live unauthenticated responses from audaconnect.ax-aee.co.uk,
  api-demo.audatex.com and services-pat.auda-target.com inspected for RateLimit-* / X-RateLimit-* /
  Retry-After headers (2026-09-17, none present). The 2026-05-04 scaffold (10 rpm free / 100 rpm
  professional / 1000 rpm enterprise with X-RateLimit-* headers) has been REPLACED — those numbers
  and headers were invented and are not published by Audatex.
tags:
  - Automotive
  - Claims Processing
  - Insurance
  - Repair Management
  - Vehicle Data
  - Rate Limiting
description: >-
  Audatex publishes NO rate limits. The only limit signal in the whole estate is a 429 response
  declared on a single API Gateway operation (POST /api/v1/PingEvent — "Returns an error if the
  rate limit has been exceeded") with no limit value, window or Retry-After header documented.
  AudaConnect's only cadence guidance is prose: poll a notification subscription "e.g. every 5
  minutes".
limit_count: 0
headers: {}
responseCodes:
  throttled: 429
  note: Declared only on POST /api/v1/PingEvent in openapi/audatex-api-gateway-openapi.yml; no other operation declares 429.
limits: []
observed_headers:
  - host: audaconnect.ax-aee.co.uk
    rate_limit_headers: []
    other: [Correlation-Id]
  - host: api-demo.audatex.com
    rate_limit_headers: []
    other: [X-Kong-Request-Id, X-Kong-Upstream-Latency, X-Kong-Proxy-Latency, api-supported-versions]
  - host: services-pat.auda-target.com
    rate_limit_headers: []
    other: []
policies:
  - name: Notification polling cadence
    description: Poll GET /api/notifications/{subscriptionId} (and the BMS Event_*NotificationsGet twins) roughly every 5 minutes, per the operation summary.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
