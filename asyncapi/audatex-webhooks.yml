method: searched
kind: webhook-catalog
source: https://audaconnect.ax-aee.co.uk/AudaAPI.WebAPI/Help/Topic/NotificationTopics (notification topics reference,
  fetched 2026-09-17), openapi/audatex-audaconnect-api-openapi.yml (Notification_* operations, SubscriptionPush
